<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎 · Welcome</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #0f172a 100%);
    color: #e2e8f0;
    overflow-x: hidden;
    padding: 32px 20px;
    position: relative;
  }

  /* 背景光晕装饰 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .5;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 420px;
    height: 420px;
    background: #6366f1;
    top: -120px;
    left: -100px;
    animation: float 12s ease-in-out infinite;
  }

  body::after {
    width: 360px;
    height: 360px;
    background: #06b6d4;
    bottom: -120px;
    right: -80px;
    animation: float 14s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(30px, -30px) scale(1.1); }
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 720px;
    width: 100%;
    padding: 48px 44px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.22);
    border: 1px solid rgba(129, 140, 248, 0.45);
    color: #c7d2fe;
    margin-bottom: 26px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.3;
    font-weight: 700;
    background: linear-gradient(90deg, #ffffff, #a5b4fc 50%, #67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 20px;
  }

  .lead {
    font-size: clamp(15px, 2.2vw, 17px);
    line-height: 1.9;
    color: #cbd5e1;
    margin-bottom: 12px;
  }

  .divider {
    width: 72px;
    height: 3px;
    margin: 30px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, #6366f1, #22d3ee);
  }

  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px;
    margin-top: 8px;
    text-align: left;
  }

  .feature {
    padding: 18px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: transform .28s ease, background .28s ease, border-color .28s ease;
  }

  .feature:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(129, 140, 248, 0.55);
  }

  .feature .icon {
    font-size: 20px;
    margin-bottom: 8px;
    display: block;
  }

  .feature h3 {
    font-size: 15px;
    font-weight: 600;
    color: #f1f5f9;
    margin-bottom: 6px;
  }

  .feature p {
    font-size: 13px;
    line-height: 1.7;
    color: #94a3b8;
  }

  footer {
    margin-top: 34px;
    font-size: 13px;
    color: #64748b;
    letter-spacing: .02em;
  }

  @media (max-width: 480px) {
    .card { padding: 34px 22px; border-radius: 20px; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Welcome</span>

    <h1>你好，很高兴见到你 👋</h1>

    <p class="lead">
      欢迎来到这里。无论你是带着一个问题、一个想法，
      还是只想随便聊聊，我都在这里，随时准备帮忙。
    </p>
    <p class="lead">
      把复杂的任务交给我，我们一起把它变得简单。
    </p>

    <div class="divider"></div>

    <div class="features">
      <div class="feature">
        <span class="icon">💡</span>
        <h3>解答问题</h3>
        <p>从日常常识到专业知识，为你理清思路。</p>
      </div>
      <div class="feature">
        <span class="icon">✍️</span>
        <h3>协助创作</h3>
        <p>写作、翻译、润色、代码，样样都能帮上忙。</p>
      </div>
      <div class="feature">
        <span class="icon">🚀</span>
        <h3>推进项目</h3>
        <p>拆解目标、规划步骤，让想法真正落地。</p>
      </div>
    </div>

    <footer>随时开始你的第一个问题吧 · 我在这里等你</footer>
  </main>
</body>
</html>
