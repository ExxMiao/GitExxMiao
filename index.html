
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的个人空间</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", sans-serif;
            color: white;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #312e81
            );
            text-align: center;
        }

        .welcome {
            max-width: 800px;
            padding: 40px 25px;
            animation: fadeIn 1.5s ease;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 15px;
            color: #a5b4fc;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .description {
            font-size: 17px;
            line-height: 2.2;
            color: #cbd5e1;
        }

        .footer {
            margin-top: 45px;
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="welcome">
        <h1>欢迎来到我的个人空间</h1>

        <div class="subtitle">
            WELCOME TO MY DIGITAL SPACE
        </div>

        <div class="description">
            <p>你好，欢迎你的到来！</p>
            <p>这里是一个记录想法、探索技术、分享知识的地方。</p>
            <p>保持好奇，持续探索，让每一次想法都有机会成为现实。</p>
            <p>感谢你的访问，祝你拥有一段愉快的浏览时光！</p>
        </div>

        <div class="footer">
            EXPLORE · CREATE · DISCOVER
        </div>
    </div>
</body>
</html>
